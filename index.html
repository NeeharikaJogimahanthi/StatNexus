<style>
  :root {
    --ink: #0F172A;
    --body: #334155;
    --muted: #475569;
    --faint: #64748B;
    --line: #E2E8F0;
    --line-strong: #CBD5E1;
    --bg: #F8FAFC;
    --panel: #FFFFFF;
    --primary: #1D4ED8;
    --primary-hover: #1E40AF;
    --primary-soft: #EFF6FF;
    --primary-line: #BFDBFE;
    --ok: #047857;
    --ok-soft: #ECFDF5;
    --ok-line: #A7F3D0;
    --err: #B91C1C;
    --err-soft: #FEF2F2;
    --err-line: #FECACA;
    --warn: #B45309;
    --warn-soft: #FFFBEB;
    --warn-line: #FDE68A;
    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 18px;
    --shadow-bar: 0 -1px 0 rgba(15, 23, 42, 0.06), 0 -8px 24px -12px rgba(15, 23, 42, 0.10);
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--body);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  /* ---- focus discipline: every interactive element gets a visible ring ---- */
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
    border-radius: var(--r-sm);
  }
  /* ---- primitives ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 0 20px;
    border-radius: var(--r-sm);
    font-size: 15px; font-weight: 600; line-height: 1;
    border: 1px solid transparent;
    cursor: pointer; transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    text-decoration: none; white-space: nowrap;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:not(:disabled):hover { background: var(--primary-hover); }
  .btn-ghost { background: var(--panel); color: var(--body); border-color: var(--line-strong); }
  .btn-ghost:not(:disabled):hover { background: var(--bg); border-color: var(--faint); }
  .link-btn:hover { background: var(--line); }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 22px 24px;
  }
  .opt {
    display: flex; align-items: flex-start; gap: 12px; width: 100%;
    padding: 14px 16px; border-radius: var(--r-sm);
    border: 1.5px solid var(--line); background: var(--panel);
    cursor: pointer; min-height: 44px;
    transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
    text-align: left;
  }
  .opt:hover { border-color: var(--primary-line); background: var(--primary-soft); }
  .opt input { accent-color: var(--primary); width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; cursor: pointer; }
  .opt:has(input:checked) {
    border-color: var(--primary); background: var(--primary-soft);
    box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
  }
  .step-in { animation: stepIn .22s ease both; }
  @keyframes stepIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 999px; transition: width .5s ease; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
  .ph { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .step-dot { transition: all .18s ease; }
  a.skip { position: absolute; left: -9999px; top: 0; background: var(--primary); color: #fff; padding: 10px 16px; border-radius: 0 0 10px 0; z-index: 60; }
  a.skip:focus { left: 0; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    html { scroll-behavior: auto; }
  }
</style>

rolled":"1,620 Officers","description":"GVA at Basic Prices, Double Deflation, FISIM estimation, and capitalization of digital data and AI assets.","competencyCovered":"National Accounts & Macroeconomics"},{"id":"C-103","code":"DPD-TECH-02","title":"Python & Apache Arrow for Automated Microdata Scrutiny","category":"Technical","provider":"Data Processing Division (DPD Kolkata)","duration":"30 Hours (Hands-on Labs)","rating":4.95,"enrolled":"3,150 Officers","description":"Vectorized data cleaning, logical scrutiny rules, MICE missing value imputation, and out-of-core microdata pipelines.","competencyCovered":"Automated Data Scrutiny"},{"id":"C-104","code":"IGOT-BEH-01","title":"Ethical Leadership & Citizen Centricity in Public Administration","category":"Behavioural","provider":"Capacity Building Commission (CBC)","duration":"10 Hours (Interactive)","rating":4.9,"enrolled":"14,200 Civil Servants","description":"Principles of ethical governance, empathy in public delivery, workplace collaboration, and stakeholder communication.","competencyCovered":"Citizen Centricity & Ethics"},{"id":"C-105","code":"IGOT-BEH-02","title":"Strategic Problem Solving & Crisis Management for Senior Officers","category":"Behavioural","provider":"LBSNAA Mussoorie & iGOT Bharat","duration":"14 Hours","rating":4.8,"enrolled":"6,800 Officers","description":"Evidence-based policymaking, conflict resolution, inter-departmental consensus building, and adaptive civil leadership.","competencyCovered":"Strategic Leadership"},{"id":"C-106","code":"IGOT-CORE-01","title":"DoPT Digital Governance, e-Office & DPDP Compliance","category":"Prescribed iGOT","provider":"Department of Personnel & Training & MeitY","duration":"16 Hours","rating":4.92,"enrolled":"22,500 Officers","description":"Mandatory compliance module covering e-Files, CPGRAMS grievance SLAs, RTI Section 8 exemptions, and DPDP Act 2023.","competencyCovered":"Digital Governance & Privacy"},{"id":"C-107","code":"PSU-OPS-01","title":"PSU Industrial Analytics, Energy Accounting & OEE Optimization","category":"Technical","provider":"National Productivity Council & DPE","duration":"20 Hours (Case Studies)","rating":4.88,"enrolled":"1,940 PSU Officers","description":"Overall Equipment Effectiveness, hydrocarbon reconciliation, industrial IoT telemetry, and Make in India procurement rules.","competencyCovered":"PSU Operations & Analytics"},{"id":"C-108","code":"CBC-BEH-03","title":"Inter-Ministerial Stakeholder Coordination & Public Negotiations","category":"Behavioural","provider":"Capacity Building Commission & LBSNAA","duration":"12 Hours (Interactive)","rating":4.91,"enrolled":"8,400 Officers","description":"Cross-departmental alignment, consensus building during national survey rollouts, and transparent multi-agency negotiations.","competencyCovered":"Inter-Departmental Coordination"},{"id":"C-109","code":"NSSTA-BEH-04","title":"Team Dynamics, Field Supervision & Conflict Resolution in Large Surveys","category":"Behavioural","provider":"NSSTA Greater Noida","duration":"15 Hours (Simulations)","rating":4.87,"enrolled":"5,300 Officers","description":"Field team motivation, managing surveyor disputes, non-response mitigation diplomacy, and ethical fieldwork supervision.","competencyCovered":"Field Leadership & Conflict Resolution"},{"id":"C-110","code":"ISI-TECH-05","title":"Machine Learning & Econometric Forecasting for Official Statistics","category":"Technical","provider":"Indian Statistical Institute (ISI) & MoSPI","duration":"28 Hours (Python Labs)","rating":4.96,"enrolled":"3,750 Officers","description":"Time-series nowcasting with ARIMA and LightGBM, satellite remote sensing for crop yields, and high-frequency CPI indicators.","competencyCovered":"Advanced Econometrics & AI"}],"INITIAL_COMPETENCIES":[{"id":"sampling","name":"Field Sampling & Survey Design","baseline":85,"current":62,"target":90,"status":"Critical Gap"},{"id":"accounts","name":"National Accounts & Macroeconomics","baseline":80,"current":58,"target":85,"status":"Moderate Gap"},{"id":"python","name":"Python & Automated Data Scrutiny","baseline":90,"current":48,"target":90,"status":"Priority Need"},{"id":"governance","name":"Digital Governance & Data Privacy","baseline":75,"current":72,"target":85,"status":"On Track"}],"QUESTION_BANK":{"sampling":{"Easy":[{"id":"s_e_1","topic":"Sampling Units","competency":"Survey Execution & CAPI","question":"In standard multi-stage survey design, what distinguishes a Primary Sampling Unit (PSU) from an Ultimate Sampling Unit (SSU)?","options":["PSUs are the first-stage administrative clusters (e.g. Census villages/urban blocks), while SSUs are the final sampled households.","PSUs are always individual factories, while SSUs are nationwide industry sectors.","PSUs and SSUs are interchangeable terms with no methodological difference.","PSUs are only surveyed once every ten years in decennial population censuses."],"correct":0,"citation":"NSSTA Survey Design Handbook — Section 1.2","explanation":"In multi-stage sampling, PSUs represent first-stage clusters (FSUs/PSUs), within which ultimate sample units (households/enterprises) are listed."},{"id":"s_e_2","topic":"Sampling Frames","competency":"Frame Validation","question":"What is the primary statistical consequence of using an outdated urban frame during household listing?","options":["Coverage error (under-coverage of newly urbanized colonies and over-coverage of demolished dwellings).","Immediate hardware breakdown of the enumerator's CAPI tablet.","Automatic doubling of the district population multiplier.","Zero variance across all survey estimates."],"correct":0,"citation":"NSSO FOD Field Manual — Chapter 1","explanation":"An obsolete frame leads to coverage bias, omitting newly constructed settlements and listing non-existent structures."},{"id":"s_e_3","topic":"Doorstep Sample Selection","competency":"Probability Sampling","question":"Why must enumerators strictly follow circular systematic sampling instead of purposive household selection?","options":["To ensure every listed household has a known, non-zero probability of selection, eliminating subjective investigator bias.","To minimize the physical walking distance between interviewed households.","To interview only households that own motorized vehicles.","To ensure all surveyed households belong to the same income quintile."],"correct":0,"citation":"NSSTA Basic Sampling Guidelines — Module 2","explanation":"Probability sampling requires known non-zero selection probabilities to guarantee design-unbiased estimates."},{"id":"s_e_4","topic":"Rural Sampling Frame","competency":"Frame Construction","question":"Which administrative baseline serves as the official sampling frame for rural socio-economic surveys in India?","options":["The latest decennial Population Census Village Directory with geographical boundaries and population counts.","Commercial telephone directory subscriber lists.","District land revenue tax registers only.","Gram Panchayat election voter rolls."],"correct":0,"citation":"NSSO Sampling Design Manual — Chapter 2","explanation":"Decennial Population Census village directories provide the standard rural frame of all inhabited revenue settlements."},{"id":"s_e_5","topic":"Sampling With vs Without Replacement","competency":"Sampling Theory","question":"Why is Simple Random Sampling Without Replacement (SRSWOR) more statistically efficient than With Replacement (SRSWR)?","options":["SRSWOR incorporates the finite population correction factor (1 - n/N), yielding smaller sampling variance.","SRSWOR interviews each household at least twice.","SRSWOR reduces the district sample size to zero.","SRSWR is illegal under official statistics acts."],"correct":0,"citation":"Cochran Sampling Techniques — Chapter 2","explanation":"Without replacement eliminates duplicate selection of the same unit, resulting in strictly lower estimation variance."},{"id":"s_e_6","topic":"CAPI Field Validation","competency":"Field Data Quality","question":"What is the primary role of in-built validation rules on Computer-Assisted Personal Interviewing (CAPI) tablets?","options":["To trap data entry typos, out-of-range responses, and logical inconsistencies at the doorstep before transmission.","To automatically generate fabricated responses for absent households.","To compute national inflation estimates on the tablet.","To restrict enumerators from working during evening hours."],"correct":0,"citation":"MoSPI CAPI Data Scrutiny Protocol — FOD","explanation":"In-built CAPI validation checks ensure data cleanliness at point of collection, eliminating costly back-checks."}],"Medium":[{"id":"s_m_1","topic":"Hamlet-Group Formation","competency":"Field Listing & Sub-sampling","question":"Under NSSO FOD listing protocols, when a sampled village exceeds 1,200 households, what procedure is mandatory?","options":["Divide the village into artificial Hamlet-Groups (HGs) of approximately equal population size and randomly select two HGs for detailed listing.","Survey only the households located within 50 meters of the Gram Panchayat office.","Drop the village from the sample and substitute with an adjacent smaller village.","List all 1,200 households in a single continuous schedule on the tablet."],"correct":0,"citation":"NSSO FOD Field Investigators Manual — Chapter 2","explanation":"Hamlet-Group formation prevents listing fatigue, ensuring manageable and unbiased second-stage household listing."},{"id":"s_m_2","topic":"Stratified Allocation","competency":"Sample Allocation Theory","question":"Under Neyman Optimal Allocation, how are sample sizes distributed across sub-strata with unequal variances?","options":["Higher sample size is allocated to strata that are larger and exhibit greater internal variance.","Equal sample size is distributed to all strata regardless of variance.","Sample size is allocated purely in inverse proportion to strata population.","Strata with high variance are completely discarded from the frame."],"correct":0,"citation":"Sampling Theory & Methods — Chapter 4","explanation":"Neyman allocation minimizes overall variance for a fixed sample size by weighting both stratum size and standard deviation."},{"id":"s_m_3","topic":"Non-Response Weighting","competency":"Multiplier Adjustments","question":"When households in a primary sampling unit refuse interview, how is the sampling weight (multiplier) adjusted?","options":["Inflated by the inverse of the response rate within the same socio-economic sub-stratum.","Multiplied by zero and discarded from population aggregate tables.","Permanently assigned to the nearest urban district.","Replaced by the national median household income parameter."],"correct":0,"citation":"DPD Estimation & Weighting Methodology — Section 5","explanation":"Non-response adjustment factors scale up the weights of responding units within the same homogeneous sub-stratum."},{"id":"s_m_4","topic":"Ratio vs Regression Estimators","competency":"Auxiliary Information","question":"When auxiliary variable X is strongly correlated with study variable Y, under what condition is the Linear Regression Estimator strictly superior to the Ratio Estimator?","options":["When the linear regression line between Y and X does not pass through the coordinate origin (intercept != 0).","When the correlation coefficient between Y and X is exactly 1.0.","When all values of X are negative numbers.","When sample size is less than 5 households."],"correct":0,"citation":"Theory of Sample Surveys — Des Raj & Chandhok","explanation":"The Ratio Estimator assumes regression through the origin; when an intercept exists, the Regression Estimator yields smaller MSE."},{"id":"s_m_5","topic":"Stratification Efficiency","competency":"Variance Reduction","question":"How does creating internally homogeneous strata affect sampling variance relative to unstratified simple random sampling?","options":["Between-stratum variance is eliminated from overall sampling error, strictly reducing total estimation variance.","It doubles the standard error of population estimates.","It creates systematic non-sampling bias across all districts.","It forces the survey design effect (Deff) to exceed 5.0."],"correct":0,"citation":"NSSTA Intermediate Sampling Handbook — Module 3","explanation":"Stratification eliminates between-stratum differences from sampling variance, ensuring maximum precision for fixed sample size."},{"id":"s_m_6","topic":"UFS Block Demarcation","competency":"Urban Frame Operations","question":"What is the fundamental boundary criterion used during Urban Frame Survey (UFS) block updating?","options":["Clear, permanent geographical boundaries (roads, railway tracks, nullahs) enclosing 100-150 households.","Only high-income housing societies with security gates.","Ward areas based strictly on political boundaries.","Unbounded circular areas measuring exactly 5 km in radius."],"correct":0,"citation":"Urban Frame Survey (UFS) Manual — NSSO FOD","explanation":"UFS blocks must have permanent, identifiable physical boundaries and a population of 100-150 households to ensure reliable listing."}],"Hard":[{"id":"s_h_1","topic":"Design Effect & Intra-Cluster Correlation","competency":"Complex Survey Inference","question":"In Two-Stage Stratified Cluster Sampling (PLFS Round 81), how is the design effect (Deff) minimized when intra-class correlation (rho) in Primary Sampling Units is high?","options":["Increase the number of PSUs (FSUs) sampled while reducing the number of Ultimate Sampling Units (SSUs) per cluster.","Double the sample size of households within existing clusters without changing FSU count.","Switch entirely to Simple Random Sampling without stratification across frames.","Exclude all self-weighting sub-strata from the sampling frame."],"correct":0,"citation":"NSSTA Advanced Sampling Manual — Section 4.1","explanation":"When intra-cluster correlation is high, units within a cluster duplicate information. Sampling more clusters with fewer elements per cluster minimizes variance."},{"id":"s_h_2","topic":"Small Area Estimation (SAE)","competency":"Fay-Herriot Modeling","question":"In Fay-Herriot Small Area Estimation models for district-level poverty indicators, how are direct survey estimators combined with synthetic model predictors?","options":["Weighted by the ratio of sampling variance to total model variance (Empirical Best Linear Unbiased Predictor - EBLUP).","By simple arithmetic averaging without considering design variance.","By replacing direct survey estimates with national census averages whenever sample size is below 50.","By applying principal component analysis to eliminate all auxiliary administrative covariates."],"correct":0,"citation":"MoSPI Small Area Estimation Monograph — Chapter 3","explanation":"The Fay-Herriot EBLUP borrows strength from auxiliary administrative covariates, shrinking direct estimates toward the model regression line based on sampling reliability."},{"id":"s_h_3","topic":"Replication Variance Estimation","competency":"Resampling & Jackknife","question":"When estimating the standard error of non-linear ratios (such as Gini coefficient of expenditure), why is Balanced Repeated Replication (BRR) preferred over Taylor Series linearization?","options":["It directly accounts for complex multi-stage stratification and clustering without requiring analytical derivative approximations.","It eliminates the need for calculating survey design weights.","It reduces the required survey sample size by 50%.","It guarantees identical estimates across all computer architectures."],"correct":0,"citation":"Advanced Survey Methodology — Section 8.4","explanation":"Replication methods capture design variance directly from pseudo-replicate weights, avoiding tedious analytical derivatives of complex non-linear statistics."},{"id":"s_h_4","topic":"GREG Weight Calibration","competency":"Calibration Estimators","question":"In Generalized Regression Estimation (GREG), how are base design weights calibrated against known auxiliary population totals?","options":["By minimizing distance metrics (such as chi-square distance) subject to linear calibration constraints matching auxiliary margins.","By assigning equal weights to all households regardless of stratum size.","By discarding all respondents whose income exceeds the 90th percentile.","By dividing weights by the survey interviewer ID."],"correct":0,"citation":"Deville & Sarndal (1992) — Calibration Estimators in Survey Sampling","explanation":"GREG calibration adjusts survey weights to reproduce known external administrative totals while minimizing deviation from design weights."},{"id":"s_h_5","topic":"Two-Phase vs Two-Stage Sampling","competency":"Sampling Design Theory","question":"What is the structural difference between Two-Phase (Double) Sampling and Two-Stage Sampling?","options":["In two-phase sampling, a large sample is first screened for auxiliary data before subsampling identical units; in two-stage sampling, clusters are sampled first and sub-units within clusters second.","Two-phase sampling can only be done in decennial censuses, while two-stage sampling is for annual surveys.","There is no difference; both are identical technical synonyms.","Two-phase sampling requires two independent commercial survey vendors."],"correct":0,"citation":"Sarndal, Swensson, & Wretman — Model Assisted Survey Sampling","explanation":"Two-phase sampling draws a sub-sample of elements from an initial sample; two-stage sampling draws sub-units from primary sampling clusters."},{"id":"s_h_6","topic":"Structural Outlier Scrutiny","competency":"Winsorization & Robust Multipliers","question":"When extreme high-income households severely distort design-weighted aggregates, what is the standard MoSPI protocol?","options":["Treat them as self-representing units (weight = 1.0) and re-distribute remaining design weights among non-outlier units in the stratum.","Delete the outlier records entirely from survey microdata files.","Multiply the outlier values by zero and report median income only.","Force all households in the district to adopt the outlier value."],"correct":0,"citation":"MoSPI Microdata Scrutiny and Outlier Guidelines — SDRD","explanation":"Treating extreme validated units as self-representing prevents their enormous multipliers from wildly inflating national population aggregates."}]},"accounts":{"Easy":[{"id":"a_e_1","topic":"GDP Compilation Approaches","competency":"Macroeconomic Fundamentals","question":"What are the three conceptually equivalent approaches used in national accounts to compile Gross Domestic Product (GDP)?","options":["Production (Output) Approach, Income Approach, and Expenditure Approach.","Cash Balance Approach, Speculative Approach, and Fiscal Deficit Approach.","Export-Import Differential, Forex Reserves, and Bank Repo Rate.","Population Growth Factor, Agricultural Monsoon Index, and Sensex Volume."],"correct":0,"citation":"CSO National Accounts Compilation Guide — Chapter 1","explanation":"GDP measures the monetary value of final goods/services via Output, Income generated, and Final Expenditure."},{"id":"a_e_2","topic":"Nominal vs Real GDP","competency":"Price Deflators","question":"How is Real GDP derived from Nominal GDP in macroeconomic reporting?","options":["By dividing Nominal GDP by the GDP Deflator (price index) and multiplying by 100 to remove inflation effects.","By adding current year GST collections directly to Nominal GDP.","By subtracting foreign direct investment from the trade balance.","By multiplying Nominal GDP by the annual bank lending rate."],"correct":0,"citation":"CSO Price Statistics & Deflators — Module 2","explanation":"Real GDP reflects true volume output evaluated at base year prices by deflating nominal output with the comprehensive GDP deflator."},{"id":"a_e_3","topic":"Gross Fixed Capital Formation","competency":"Capital Accounting","question":"Which expenditure component constitutes Gross Fixed Capital Formation (GFCF)?","options":["Acquisition of machinery, equipment, intellectual property products, and infrastructure construction minus disposals.","Total household spending on daily food and consumer perishables.","Government subsidy payments to public welfare schemes.","Foreign portfolio investments held in Indian equity mutual funds."],"correct":0,"citation":"System of National Accounts — Chapter 10","explanation":"GFCF measures net additions of fixed capital assets (buildings, roads, machinery, R&D) used repeatedly in productive processes."},{"id":"a_e_4","topic":"Factor Cost vs Market Prices","competency":"Valuation Concepts","question":"What accounts for the difference between GDP at Factor Cost and GDP at Market Prices?","options":["Net Product Taxes (Product Taxes minus Product Subsidies).","Total personal income taxes collected by the central board.","Depreciation of transport vehicles only.","Commercial bank interest rate spreads."],"correct":0,"citation":"National Accounts Concepts — CSO NAD","explanation":"Market prices include indirect product taxes and deduct product subsidies, whereas factor cost evaluates payments to factors."},{"id":"a_e_5","topic":"Gross Value Added (GVA)","competency":"Production Output","question":"How is Gross Value Added (GVA) computed from enterprise production data?","options":["Gross Value of Output minus the value of Intermediate Consumption.","Total Sales Revenue plus corporate dividend tax.","Total worker wages multiplied by the annual inflation index.","Net Profit after corporate income tax deductions."],"correct":0,"citation":"System of National Accounts 2008 — Chapter 6","explanation":"GVA measures the net contribution of each producer by deducting intermediate goods and services consumed from gross output."},{"id":"a_e_6","topic":"Household Consumption Scope","competency":"HFCE Scope","question":"What is included under Household Final Consumption Expenditure (HFCE)?","options":["Consumer spending on goods and services, plus imputed rent of owner-occupied dwellings and goods produced for own consumption.","Only cash transactions conducted at registered supermarkets.","Purchase of residential land and financial equity shares.","Direct income tax payments to central and state governments."],"correct":0,"citation":"SNA Compilation Guidelines — Chapter 9","explanation":"HFCE encompasses all resident household consumer expenditures, including imputed values of owner-occupied housing services."}],"Medium":[{"id":"a_m_1","topic":"FISIM Reference Rate","competency":"Financial Intermediation","question":"In SNA 2008/2025, how is Financial Intermediation Services Indirectly Measured (FISIM) calculated?","options":["As the spread between actual interest rates charged/paid and a risk-free reference rate on loans and deposits.","By totaling the gross dividend payouts of all commercial banks in the financial year.","As 18% GST charged on digital banking transactions.","By subtracting non-performing assets from the RBI repo rate."],"correct":0,"citation":"SNA 2008 Framework — Paragraph 6.163","explanation":"FISIM quantifies indirect banking service charges through the interest rate differential between loans/deposits and the reference interbank rate."},{"id":"a_m_2","topic":"Basic Prices vs Market Prices","competency":"GVA at Basic Prices","question":"What is the relationship between Gross Value Added (GVA) at Basic Prices and GDP at Market Prices in Indian National Accounts?","options":["GDP at Market Prices = GVA at Basic Prices + Product Taxes - Product Subsidies.","GDP at Market Prices = GVA at Basic Prices - Income Tax + Import Tariffs.","GDP at Market Prices = GVA at Basic Prices multiplied by the Consumer Price Index.","GVA at Basic Prices and GDP at Market Prices are strictly identical."],"correct":0,"citation":"MoSPI Methodology on GVA at Basic Prices — Section 2","explanation":"Under the 2011-12 base revision, GDP at Market Prices equals GVA at Basic Prices plus net product taxes (taxes minus subsidies)."},{"id":"a_m_3","topic":"Double Deflation","competency":"Volume Estimation","question":"Why is the Double Deflation method required to accurately compile Real Gross Value Added (GVA) for manufacturing?","options":["It independently deflates gross output with output price indices and intermediate inputs with input price indices.","It applies the deflator twice to compensate for rounding errors.","It eliminates all indirect tax revenue from corporate balance sheets.","It matches wholesale prices with international commodities."],"correct":0,"citation":"CSO Double Deflation Working Paper — NAD","explanation":"Single deflation creates bias when raw material input prices diverge from final output prices. Double deflation calculates real output minus real inputs."},{"id":"a_m_4","topic":"CFC vs Book Depreciation","competency":"Capital Consumption","question":"Why does Consumption of Fixed Capital (CFC) in national accounts differ from historical commercial book depreciation?","options":["CFC is valued at current replacement cost of assets, while book depreciation is based on historic purchase price.","CFC applies only to government buildings and never to machinery.","Book depreciation is always double the economic capital wear and tear.","CFC can only be compiled for public sector undertakings."],"correct":0,"citation":"SNA 2008 — Chapter 6","explanation":"Economic national accounts measure capital consumption at current replacement prices, whereas tax and accounting books use historical acquisition costs."},{"id":"a_m_5","topic":"R&D Capitalization","competency":"Intellectual Property Products","question":"Under SNA 2008 and Indian National Accounts, how is enterprise Research and Development (R&D) treated?","options":["As Gross Fixed Capital Formation (Intellectual Property Asset), rather than intermediate consumption.","As regular current operational expense with zero asset creation.","As bilateral foreign direct investment.","As financial transfer payment to the Ministry of Science and Technology."],"correct":0,"citation":"MoSPI Advisory on SNA 2008 Base Year Revision — CSO","explanation":"R&D produces economic benefits over multiple periods and is classified as intellectual property capital formation."},{"id":"a_m_6","topic":"Informal Economy Estimation","competency":"Unorganized Sector GVA","question":"How is unorganized sector Gross Value Added (GVA) estimated in inter-censal years in India?","options":["By applying benchmark labour input (workforce estimates) multiplied by estimated GVA per worker (GVAW) from enterprise surveys.","By assuming unorganized sector output is always zero.","By checking daily transactions on commercial credit card networks.","By doubling the organized corporate sector tax revenues."],"correct":0,"citation":"National Accounts Sources & Methods — CSO NAD","explanation":"The labour input method combines enterprise survey value-added per worker with Periodic Labour Force Survey workforce estimates."}],"Hard":[{"id":"a_h_1","topic":"SNA 2025 Digital Capitalization","competency":"Digital Economy Accounting","question":"Under the upcoming SNA 2025 update, how are digital data assets and artificial intelligence models classified in national accounts balance sheets?","options":["As Produced Intellectual Property Assets, capitalized based on the sum of development costs (data acquisition, curation, computing and human capital).","As zero-value non-produced natural resources excluded from GDP.","As current intermediate consumption expensed fully in the year of creation.","As monetary gold reserves stored with the Reserve Bank of India."],"correct":0,"citation":"UN Statistical Commission SNA 2025 Guidance Note — Digitization","explanation":"SNA 2025 recognizes data and AI algorithms as produced fixed assets that deliver economic benefits over multiple reporting periods."},{"id":"a_h_2","topic":"Cross-Border Cloud Accounting","competency":"External Trade in Services","question":"When domestic enterprises utilize cloud computing infrastructure hosted in foreign sovereign data centres, how is this recorded in National Accounts and BoP?","options":["As import of Computer and Information Services under Current Account, deducted from domestic Gross Value Added as intermediate consumption.","As domestic gross capital formation inside state territory.","As bilateral foreign aid grant transferred to overseas cloud vendors.","Ignored because cloud services have zero physical border crossing."],"correct":0,"citation":"RBI Balance of Payments Manual (BPM6) & SNA 2025","explanation":"Cross-border digital services represent service imports (Mode 1 supply) reducing domestic GVA unless capitalized as bespoke IP."},{"id":"a_h_3","topic":"Hedonic Price Quality Adjustments","competency":"Deflator Construction","question":"Why are hedonic regression methods employed when constructing price indices for information and communication technology (ICT) capital assets?","options":["To decouple pure price inflation from rapid quality improvements (e.g. processor speed, memory capacity, energy efficiency).","To artificially lower inflation figures for annual budget speeches.","To convert wholesale transactions into retail consumer prices.","To eliminate seasonal price cycles in agricultural commodities."],"correct":0,"citation":"OECD Handbook on Hedonic Price Indexes — Section 3","explanation":"Hedonic pricing decomposes asset prices into constituent characteristics, ensuring quality surges are captured as volume growth rather than price inflation."},{"id":"a_h_4","topic":"Supply & Use Tables (SUT)","competency":"SUT Balancing","question":"In Supply and Use Tables (SUT), how are trade and transport margins allocated across commodities?","options":["Added to basic prices to convert supply into purchaser prices, balancing commodity uses with total supply.","Subtracted from the final GDP aggregate as deadweight loss.","Credited entirely to the railway ministry as dividend revenue.","Grouped under international foreign exchange reserves."],"correct":0,"citation":"Supply & Use Tables Handbook — CSO NAD","explanation":"Trade and transport margins bridge basic prices (producer receipts) and purchaser prices (buyer costs), ensuring macroeconomic balance."},{"id":"a_h_5","topic":"Financial Derivatives & Repos","competency":"Flow of Funds","question":"In SNA financial balance sheets, how are repurchase agreements (repos) recorded between financial corporations?","options":["As collateralized loans with securities pledged, retaining economic ownership with the original borrower.","As outright irreversible sales of sovereign debt securities.","As physical inventory capital formation.","As non-tax government revenue grants."],"correct":0,"citation":"SNA 2008 Financial Accounts — Chapter 11","explanation":"Repos represent collateralized cash borrowings where economic ownership of the underlying securities remains with the seller."},{"id":"a_h_6","topic":"Natural Capital Accounting (SEEA)","competency":"Environmental Accounts","question":"Under the System of Environmental-Economic Accounting (SEEA-CF), how is subsoil mineral depletion integrated into Adjusted Net Savings?","options":["Deducted from Gross Capital Formation as capital depletion of non-renewable natural assets.","Added directly to commercial banking liquidity reserves.","Classified as consumer expenditure on durable goods.","Ignored because mineral reserves have zero market price."],"correct":0,"citation":"UN SEEA Central Framework & MoSPI Environmental Accounts","explanation":"SEEA treats depletion of subsoil assets as a deduction from gross savings to reflect the true sustainable economic wealth trajectory."}]},"labour":{"Easy":[{"id":"l_e_1","topic":"Activity Status Concept","competency":"PLFS Methodology","question":"What is the primary difference between Usual Principal Activity Status (ps) and Current Weekly Status (cws) in the Periodic Labour Force Survey?","options":["Usual Status evaluates reference period of 365 days, whereas Current Weekly Status evaluates reference period of 7 days preceding survey.","Usual Status is surveyed only for urban males, while Current Weekly Status is only for rural females.","Usual Status is measured only in decennial censuses.","There is no difference; both use identical 30-day reference criteria."],"correct":0,"citation":"PLFS Annual Report — Concepts and Definitions","explanation":"Usual status captures long-term major activity over the preceding 365 days; CWS evaluates economic activity during the past 7 days."},{"id":"l_e_2","topic":"ASI Registered Factories","competency":"Annual Survey of Industries","question":"Which industrial establishments are covered under the frame of the Annual Survey of Industries (ASI)?","options":["Factories registered under Sections 2m(i) and 2m(ii) of the Factories Act 1948 and Bidi/Cigar establishments.","Only unorganized street vendors with turnover below 5 lakhs.","Multi-national software IT offices in Special Economic Zones.","Government ministries and district collectorate offices."],"correct":0,"citation":"ASI Instruction Manual — Chapter 1","explanation":"ASI covers registered factories employing 10+ workers with power or 20+ workers without power under the Factories Act."},{"id":"l_e_3","topic":"Unincorporated Enterprises","competency":"ASUSE Guidelines","question":"What defines an unincorporated non-agricultural enterprise under the ASUSE survey frame?","options":["Proprietary or partnership enterprises engaged in non-agricultural activities that are not registered under the Companies Act 2013.","All public sector undertakings listed on the National Stock Exchange.","Commercial banks operating national ATM networks.","State agricultural produce marketing committees (APMC)."],"correct":0,"citation":"ASUSE Survey Methodology — NSSO DPD","explanation":"ASUSE covers informal, proprietary, and partnership enterprises outside corporate registration and the Factories Act."},{"id":"l_e_4","topic":"Labour Force Participation Rate","competency":"Labour Indicators","question":"How is the Labour Force Participation Rate (LFPR) mathematically defined?","options":["Percentage of total population that is either employed or actively seeking work: (Labour Force / Total Population) * 100.","Percentage of civil servants with gazetted rank.","Total employed workers divided by the national GDP deflator.","Ratio of urban workers to rural agricultural laborers."],"correct":0,"citation":"MoSPI Key Labour Indicators — Technical Note","explanation":"LFPR indicates the supply of labor available for market production in the economy."},{"id":"l_e_5","topic":"Worker Population Ratio","competency":"Employment Metrics","question":"How does the Worker Population Ratio (WPR) differ conceptually from the LFPR?","options":["WPR includes only employed persons in the numerator, excluding unemployed job seekers.","WPR evaluates only workers above 60 years of age.","WPR measures factory output rather than human labor.","There is no difference; WPR and LFPR are strictly identical."],"correct":0,"citation":"PLFS Indicators Guide — SDRD","explanation":"WPR reflects the proportion of the population that is actually engaged in productive work (Employed / Population)."},{"id":"l_e_6","topic":"OAE vs Establishment","competency":"Enterprise Classifications","question":"In enterprise surveys (ASI/ASUSE), what distinguishes an Own Account Enterprise (OAE) from an Establishment?","options":["An OAE operates with family labor without any hired worker on a fairly regular basis; an Establishment employs at least one hired worker.","An OAE is owned by the state government, while an Establishment is private.","An OAE has annual turnover exceeding 100 crores.","An OAE can only manufacture electrical appliances."],"correct":0,"citation":"ASUSE Concepts & Definitions — MoSPI","explanation":"The defining criterion is hired labor: OAEs employ no regular hired workers, whereas establishments employ hired workers."}],"Medium":[{"id":"l_m_1","topic":"Unemployment Rate Calculation","competency":"Labour Market Analytics","question":"In official labour statistics, what constitutes the denominator when calculating the Unemployment Rate (UR)?","options":["The Labour Force (Employed + Unemployed persons), NOT the total population.","The total national population including children and retirees.","Total taxpayers registered under GST portals.","Total students enrolled in tertiary education."],"correct":0,"citation":"MoSPI Labour Market Statistics — Technical Note","explanation":"Unemployment rate evaluates the percentage of active labor market participants who are unable to find work."},{"id":"l_m_2","topic":"Enterprise Weighting","competency":"Multiplier Compilation","question":"In the Annual Survey of Unincorporated Sector Enterprises (ASUSE), how is the enterprise schedule multiplier calculated?","options":["Inverse probability of selecting the FSU cluster multiplied by the inverse probability of selecting the enterprise within the hamlet/stratum.","By dividing the enterprise electricity bill by national average kilowatt tariff.","As a constant multiplier of 100 applied uniformly across all enterprises.","By multiplying total enterprise capital by the district literacy rate."],"correct":0,"citation":"ASUSE Estimation Procedure — SDRD Kolkata","explanation":"Multi-stage sampling requires compounding inverse selection probabilities at both FSU and enterprise listing stages."},{"id":"l_m_3","topic":"ASI Capital Accounting","competency":"Fixed Assets & Depreciation","question":"In ASI Schedule Block C (Fixed Assets), how is Gross Addition to Fixed Assets computed?","options":["Value of fixed assets purchased/constructed new during the accounting year plus additions and alterations.","Annual revenue from manufactured product sales minus corporate taxes.","Net dividend distributions paid to private equity partners.","Depreciation allowance claimed under the Income Tax Act."],"correct":0,"citation":"ASI Schedule Instructions — MoSPI CSO IS Wing","explanation":"Gross additions encompass all newly acquired, constructed, or installed capital equipment before applying annual depreciation."},{"id":"l_m_4","topic":"PLFS Activity Priority Rule","competency":"Status Classification","question":"Under the priority rule of Current Weekly Status (CWS) classification in PLFS, what is the hierarchical order of economic activities?","options":["Working (Employed) takes precedence over Seeking Work (Unemployed), which takes precedence over Out of Labour Force.","Seeking Work takes precedence over all other statuses.","Attending educational institutions takes precedence over full-time work.","Activities are assigned randomly if an individual engaged in multiple roles."],"correct":0,"citation":"PLFS Survey Field Manual — Chapter 3","explanation":"The international priority criterion classifies an individual as employed if they performed at least one hour of work during the reference week."},{"id":"l_m_5","topic":"GVA Per Worker (GVAW)","competency":"Productivity Compilations","question":"How is Gross Value Added per Worker (GVAW) compiled in the unorganized enterprise sector?","options":["Total estimated Gross Value Added of the sector divided by the estimated total number of workers (including working owners and hired staff).","Total salary expenses divided by the number of factory supervisors.","Total factory area in square meters divided by annual power consumption.","National minimum wage multiplied by the consumer price index."],"correct":0,"citation":"Enterprise Statistics Methodology — CSO","explanation":"GVAW measures labor productivity by dividing sector-wide value added by total labor volume."},{"id":"l_m_6","topic":"ASI Social Security Recording","competency":"Labour Costs Compilation","question":"In ASI Block E (Employment and Labour Costs), which elements are recorded under Employers' Contributions to Statutory Funds?","options":["Employees' Provident Fund (EPF), Employees' State Insurance (ESI), and Gratuity payments made by the employer.","Discretionary executive entertainment vouchers.","Travel allowances for overseas client visits.","Capital dividends paid to equity stockholders."],"correct":0,"citation":"ASI Instructions for Field Staff — Block E","explanation":"Block E records total cost of labor, including statutory social security contributions (EPF, ESI, gratuity) paid by employers."}],"Hard":[{"id":"l_h_1","topic":"Informal Employment Metrics","competency":"ICLS-21 Compliance","question":"Under the revised 21st ICLS resolution on work relationships, what criteria determine informal employment in formal sector enterprises?","options":["Employment relationships lacking social security contributions, paid annual leave, or statutory sick leave protections.","Workers who receive wages in digital bank transfers rather than cash currency.","Employees who work fewer than 40 hours per week.","Workers holding permanent civil service gazetted appointments."],"correct":0,"citation":"ILO 21st ICLS Resolution on Work & Employment Statistics","explanation":"Informal jobs within formal firms lack basic legal/social protections, such as employer-paid pension or medical benefits."},{"id":"l_h_2","topic":"NIC Industry Code Transition","competency":"Industrial Classification","question":"When mapping legacy enterprise microdata from NIC-2008 to modern digital classifications, how are multi-activity conglomerates assigned their primary 5-digit code?","options":["Top-down method based on the activity generating the largest Gross Value Added (or turnover/employment if GVA is unobserved).","Random assignment to the first industrial activity declared in registration forms.","By averaging the numeric digits of all secondary activities.","By assigning all multi-activity units exclusively to the retail trade code."],"correct":0,"citation":"National Industrial Classification (NIC) Manual — Principles of Classification","explanation":"The top-down principle ensures that dominant contribution to value added determines the principal economic activity code."},{"id":"l_h_3","topic":"Missing Working Capital Imputation","competency":"Microdata Imputation","question":"In seasonal agro-processing enterprise surveys with intermittent operating cycles, which imputation technique avoids biasing operating surplus?","options":["Predictive Mean Matching (PMM) within donor pools matched on operating months, machine capacity, and raw material throughput.","Substituting zero for working capital across all off-season months.","Replacing missing values with the national corporate average working capital.","Deleting all seasonal enterprises completely from survey tabulation."],"correct":0,"citation":"MoSPI Enterprise Microdata Imputation Protocols — DIID","explanation":"Predictive Mean Matching preserves actual observed values from realistic donor enterprises with matching seasonality characteristics."},{"id":"l_h_4","topic":"Person-Days Worked in Seasonal Factories","competency":"Mandays Compilation","question":"In sugar mills and tea processing factories operating seasonal shifts, how are total person-days worked aggregated in ASI?","options":["Sum of workers attending each shift multiplied by operating days, compiled separately for men, women, and contract workers.","Annual factory calendar days multiplied by the maximum supervisory capacity.","Total electricity consumed divided by 8 hours per shift.","Equal distribution of 365 days across all listed workers."],"correct":0,"citation":"ASI Field Manual — Mandays Aggregations","explanation":"Mandays worked capture true labor intensity by accumulating actual worker attendance counts across operational shifts."},{"id":"l_h_5","topic":"Net Addition to Fixed Capital","competency":"Capital Formation","question":"In ASI capital accounting, how is Net Addition to Fixed Capital derived?","options":["Gross Additions to fixed assets minus deductions/disposals during the year minus depreciation charged during the year.","Closing balance of inventory plus outstanding customer receivables.","Total export revenue minus import duty rebates.","Net profit transferred to statutory reserves."],"correct":0,"citation":"ASI Schedule Concepts — CSO IS Wing","explanation":"Net additions reflect net capacity additions after accounting for physical disposals and asset depreciation wear."},{"id":"l_h_6","topic":"Unpaid Family Workers Valuation","competency":"Mixed Income Disentanglement","question":"In family-owned unorganized enterprises, why is enterprise surplus termed 'Mixed Income' in SNA rather than Operating Surplus?","options":["Because it inextricably combines return to unpaid family labor and return to family-owned entrepreneurial capital.","Because the enterprise manufactures both agricultural and industrial products.","Because transactions are conducted in mixed physical and digital currencies.","Because accounts are audited by two independent chartered accountants."],"correct":0,"citation":"System of National Accounts — Mixed Income Framework","explanation":"Unincorporated sole proprietorships cannot separate compensation for owner-family labor from remuneration on invested capital."}]},"python":{"Easy":[{"id":"p_e_1","topic":"Statistical Outlier Detection","competency":"Microdata Cleaning","question":"When screening household consumption expenditure data in Python, how is the Interquartile Range (IQR) rule applied to identify anomalies?","options":["Values falling below Q1 - 1.5 * IQR or above Q3 + 1.5 * IQR are flagged as potential outliers.","Values greater than the median multiplied by 10 are deleted automatically.","All values above the 50th percentile are replaced by zero.","The standard deviation is added directly to the minimum expenditure."],"correct":0,"citation":"MoSPI Data Scrutiny Guidelines — Chapter 3","explanation":"Tukey's IQR filter flags observations outside 1.5 times the spread of the middle 50% of the distribution."},{"id":"p_e_2","topic":"Relational Merging in Pandas","competency":"Roster Linking","question":"To combine household-level characteristics with individual member schedules in Pandas, which function is appropriate?","options":["pd.merge(hh_df, person_df, on=['FSU', 'Sample_HH_No'], how='inner')","pd.concat([hh_df, person_df], axis=0)","hh_df.append(person_df)","person_df.to_csv('merged.csv')"],"correct":0,"citation":"Official Statistics Python Cookbook — DPD Kolkata","explanation":"`pd.merge` performs relational joins on composite keys (FSU, Household ID), linking household attributes to each member."},{"id":"p_e_3","topic":"Boolean Scrutiny Filters","competency":"Data Scrutiny Logic","question":"In Python, which expression correctly flags impossible records where age is under 12 but marital status is recorded as married?","options":["df[(df['age'] < 12) & (df['marital_status'] == 'Married')]","df[df['age'] < 12 or df['marital_status'] == 'Married']","df.filter(age < 12, marital_status == 'Married')","df['age'].between(0, 12).sum()"],"correct":0,"citation":"DPD CAPI Validation Rules Manual — Section 4","explanation":"Pandas uses bitwise `&` for element-wise logical AND evaluation across boolean Series."},{"id":"p_e_4","topic":"Missing Value Detection","competency":"Data Cleaning","question":"In Pandas, which method counts total missing values in each column of survey microdata?","options":["df.isna().sum()","df.count_nulls()","df.drop_empty()","df.columns.empty()"],"correct":0,"citation":"Data Processing Division Python Manual","explanation":"`df.isna().sum()` computes boolean null indicators and sums True values per column."},{"id":"p_e_5","topic":"Duplicate Record Screening","competency":"Uniqueness Auditing","question":"How do you identify duplicate household interviews on composite keys (District, FSU, Household Number)?","options":["df.duplicated(subset=['district', 'fsu', 'hh_no'], keep=False)","df.unique(['district', 'fsu', 'hh_no'])","df.drop_duplicates(inplace=False)","df['hh_no'].is_unique()"],"correct":0,"citation":"Microdata Ingestion Quality Checks — DPD","explanation":"`.duplicated(subset=..., keep=False)` flags all rows participating in composite key collisions."},{"id":"p_e_6","topic":"Group Aggregation","competency":"Summary Statistics","question":"Which Pandas command computes mean consumer expenditure grouped by Sector (Rural vs Urban)?","options":["df.groupby('sector')['mpce'].mean()","df.pivot('sector', 'mpce')","df.aggregate('sector', mean='mpce')","df['mpce'].sort_values('sector')"],"correct":0,"citation":"Python for Statistical Analysts — NSSTA","explanation":"`.groupby('sector')['mpce'].mean()` groups records by Sector and computes arithmetic average MPCE."}],"Medium":[{"id":"p_m_1","topic":"Vectorized Conditional Imputation","competency":"Vectorized Operations","question":"In large microdata pipelines, why is `numpy.select()` preferred over row-by-row `apply(lambda ...)` for survey code imputation?","options":["It executes in optimized C/SIMD memory loops, running 100x to 500x faster on multi-million row datasets.","It eliminates the need for allocating random access memory.","It automatically submits the script to the National Data Warehouse.","It encrypts all strings with AES-256."],"correct":0,"citation":"High-Performance Data Engineering in Official Statistics","explanation":"Vectorized conditional selection avoids Python bytecode interpreter overhead on large national microdata files."},{"id":"p_m_2","topic":"Logical Validation Frameworks","competency":"Automated Quality Assurance","question":"When designing automated CAPI validation rules in Python, which data structure best represents inter-field cross-validation checks?","options":["Declarative schema rules (e.g. Pydantic models with `@validator` decorators) that enforce type, range, and cross-field predicates.","Hardcoded nested `if-else` blocks inside text files.","Global string variables containing raw SQL statements.","Unordered dictionary keys with no assertion logic."],"correct":0,"citation":"MoSPI DIID Automated Quality Architecture Manual","explanation":"Declarative validation models separate business scrutiny rules from ingestion logic, facilitating auditability and error reporting."},{"id":"p_m_3","topic":"Multivariate Missing Value Imputation","competency":"Advanced Imputation","question":"When enterprise expenditure data contains missing values in correlated fields (e.g. Electricity, Fuel, Raw Materials), which method is statistically sound?","options":["Iterative Imputer (MICE) using chained regressions conditioned on enterprise size and industry code.","Replacing all missing cells with the overall column mean.","Forward filling values from the preceding unrelated enterprise.","Discarding every enterprise that has a single missing item."],"correct":0,"citation":"Scikit-Learn Microdata Imputation Best Practices","explanation":"Multivariate Imputation by Chained Equations (MICE) preserves covariance structures across complementary expenditure categories."},{"id":"p_m_4","topic":"Census Code Regex Validation","competency":"String Verification","question":"Which Python regex pattern validates a 6-digit Census Village Code containing only numbers 0-9?","options":["r'^\\d{6}$'","r'^[A-Z]{6}$'","r'\\w{6}'","r'^\\d+$'"],"correct":0,"citation":"Official Data Engineering Rules — DPD","explanation":"`^\\d{6}$` strictly asserts exactly six decimal digit characters anchored from start to end."},{"id":"p_m_5","topic":"Datetime Age Verification","competency":"Temporal Audits","question":"How do you compute respondent age in completed years using interview date and birth date columns in Pandas?","options":["(df['interview_date'] - df['birth_date']).dt.days // 365.25","df['interview_date'].year - df['birth_date'].year","df['birth_date'].str.slice(0, 4).astype(int)","df['interview_date'].apply(lambda x: x.age)"],"correct":0,"citation":"CAPI Data Scrutiny Guidelines — DPD","explanation":"Subtracting datetime timestamps and floor-dividing by 365.25 accounts for exact calendar days and leap years."},{"id":"p_m_6","topic":"Automated Scrutiny Logging","competency":"Audit Logging","question":"When automated data cleaning scripts flag anomalies, what information must be persisted in the scrutiny log?","options":["Record primary keys, error rule ID, failing field values, timestamp, and automated action taken (flagged/imputed).","Only the personal computer username.","Total count of RAM gigabytes consumed.","An encrypted hash of the operating system license."],"correct":0,"citation":"MoSPI Microdata Audit Framework — Section 4","explanation":"Comprehensive audit trails allow researchers to inspect, reverse, and verify all automated cleaning decisions."}],"Hard":[{"id":"p_h_1","topic":"High-Throughput Microdata Processing","competency":"Polars & Apache Arrow","question":"When aggregating 50 million survey microdata records across multiple rounds, why does Polars outperform Pandas in memory management?","options":["It utilizes Apache Arrow memory format, query optimization plans, and native multi-threaded Rust execution without GIL bottlenecks.","It converts all numerical data to 8-bit integers.","It requires no disk storage or swap memory.","It eliminates the need for grouping keys in aggregation queries."],"correct":0,"citation":"Modern Analytical Engines for Official Statistical Systems","explanation":"Polars builds an optimized execution plan over contiguous columnar Arrow buffers, executing in parallel across CPU cores."},{"id":"p_h_2","topic":"Statistical Disclosure Control (SDC)","competency":"Microdata Anonymization","question":"In statistical disclosure control, how does k-Anonymity combined with Differential Privacy protect public-use microdata (PUMD)?","options":["Ensures each quasi-identifier combination is shared by at least k records, while calibrated noise guarantees provable bounds on individual identification.","Encrypts the dataset so only gazetted officers can read the numbers.","Deletes the state and district columns while leaving personal names intact.","Rounds all reported monetary figures to the nearest crore."],"correct":0,"citation":"MoSPI Microdata Anonymization Framework — Section 6","explanation":"k-Anonymity suppresses unique identifiable combinations, while differential privacy limits leakage from repeated cross-tabulations."},{"id":"p_h_3","topic":"Automated Data Quality Pipelines","competency":"CI/CD & Microdata QA","question":"How does a microdata ingestion pipeline achieve deterministic reproducibility across survey rounds?","options":["By versioning data with cryptographic hashes (e.g. SHA-256), encapsulating transformation DAGs, and validating against immutable test schemas.","By manually updating cell values in spreadsheet software before saving.","By regenerating the sample frame randomly each time the pipeline runs.","By removing all audit logs after data compilation completes."],"correct":0,"citation":"Data Engineering Architecture for National Statistical Offices","explanation":"Deterministic pipelines guarantee that identical source microdata and code generate verified, bit-identical statistical aggregates."},{"id":"p_h_4","topic":"Stratified Bootstrap Variance","competency":"Resampling Computation","question":"In Python, how is stratified cluster bootstrapping implemented to compute non-linear survey standard errors?","options":["Resample FSUs (clusters) with replacement independently within each stratum, recomputing replicate weights for each bootstrap iteration.","Resample individual household rows ignoring cluster and stratum boundaries.","Draw random numbers from a standard Gaussian distribution.","Multiply sample variance by total number of survey respondents."],"correct":0,"citation":"Complex Survey Variance Estimation — Python Handbook","explanation":"Bootstrap resampling must reflect the multi-stage cluster design, resampling first-stage clusters independently within strata."},{"id":"p_h_5","topic":"Memory Optimization & Downcasting","competency":"Low-Memory Engineering","question":"How can a 20 GB survey microdata file be reduced to under 4 GB in memory without losing information in Pandas/Polars?","options":["Convert string categorical indicators to `category` dtypes and downcast 64-bit numeric integers/floats to Int16/Float32.","Delete all odd-numbered rows from the dataframe.","Convert all numeric columns to empty strings.","Store data in plain unindexed text files on USB drives."],"correct":0,"citation":"Efficient Microdata Pipelines — DPD Kolkata","explanation":"Categorical encoding and appropriate integer/float downcasting drastically reduce memory footprints on large survey files."},{"id":"p_h_6","topic":"Async Pipeline Architecture","competency":"Asynchronous Ingestion","question":"When hundreds of district FOD offices concurrently submit CAPI JSON files, which backend architecture prevents server timeouts?","options":["Asynchronous non-blocking endpoints (Asynchronous Web Frameworks) that push incoming schedules to an in-memory queue (Celery/Redis) for background batch validation.","Synchronous single-threaded scripts that process one schedule every 5 minutes.","Blocking all internet traffic during daytime hours.","Storing incoming schedules as unindexed attachments in Outlook mail."],"correct":0,"citation":"Enterprise Microdata Ingestion Architecture — DIID","explanation":"Decoupling ingestion from heavy validation using async queues guarantees high concurrency without gateway timeouts."}]},"governance":{"Easy":[{"id":"g_e_1","topic":"e-Office Workflows","competency":"Government Digitization","question":"What is the primary objective of the Central Government e-Office File Management System (FMS)?","options":["To eliminate physical paper file movement, enhance accountability, and provide digital audit trails for ministerial decisions.","To permanently lock all files so citizens cannot submit gr   Clipboard: (p) => <svg viewBox="0 0 24 24" width={p.s || 18} height={p.s || 18} fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4.5V3.8A1.8 1.8 0 0110.8 2h2.4A1.8 1.8 0 0115 3.8v.7"/><path d="M9 10h6M9 14h6M9 18h4"/></svg>,
  Target: (p) => <svg viewBox="0 0 24 24" width={p.s || 18} height={p.s || 18} fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
};

/* ---------- stepper ---------- */
const STEPS = [
  { n: 1, title: 'Officer Profile', short: 'Profile' },
  { n: 2, title: 'Recommended Courses', short: 'Courses' },
  { n: 3, title: 'Skill Assessment', short: 'Assessment' },
  { n: 4, title: 'Skill Gaps', short: 'Gaps' },
  { n: 5, title: 'Performance Dashboard', short: 'Dashboard' }
];

function Stepper({ current, maxVisited, onJump }) {
  return (
    <nav aria-label="Progress through the five learning steps" className="border-b border-slate-200 bg-white">
      <ol className="mx-auto max-w-4xl flex items-center gap-0 px-4 sm:px-6 overflow-x-auto" style={{ minHeight: 64 }}>
        {STEPS.map((s, i) => {
          const idx = i + 1;
          const done = idx < maxVisited;
          const reached = idx <= maxVisited;
          const isCurrent = idx === current;
          return (
            <li key={s.n} className="flex items-center flex-1 min-w-0" aria-current={isCurrent ? 'step' : undefined}>
              {i > 0 && <span className="h-px flex-1 mx-1 sm:mx-2" style={{ background: idx <= current ? 'var(--primary-line)' : 'var(--line)' }} aria-hidden="true"/>}
              <button
                type="button"
                onClick={() => reached && onJump(idx)}
                disabled={!reached}
                aria-label={`${s.n}. ${s.title}${isCurrent ? ' (current)' : done ? ' (completed)' : reached ? '' : ' (locked)'}`}
                className="step-dot flex items-center gap-2 px-1 py-2 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed"
                style={isCurrent ? { color: 'var(--primary)' } : {}}
              >
                <span
                  className="flex items-center justify-center rounded-full text-[12.5px] font-bold"
                  style={{
                    width: 30, height: 30,
                    background: isCurrent ? 'var(--primary)' : done ? 'var(--ok)' : 'var(--bg)',
                    color: (isCurrent || done) ? '#fff' : 'var(--faint)',
                    border: isCurrent || done ? 'none' : '1.5px solid var(--line-strong)'
                  }}
                >
                  {done ? <Icon.Check s={13}/> : s.n}
                </span>
                <span className="text-[13px] font-semibold hidden md:inline" style={!isCurrent ? { color: done ? 'var(--muted)' : 'var(--faint)' } : {}}>{s.title}</span>
                <span className="text-[12.5px] font-semibold md:hidden" style={!isCurrent ? { color: 'var(--faint)' } : {}}>{s.short}</span>
              </button>
            </li>
          );
        })}
      </ol>
    </nav>
  );
}

/* ---------- shell: step title + action bar ---------- */

/* ---------- shared loading state ---------- */
function LoadingStep({ eyebrow, title, body, message, onBack }) {

    <StepShell eyebrow={eyebrow} title={title} body={body}
