/* =====================================================================
   STEP 1 — DEFINE OFFICER PROFILE
   ===================================================================== */
function StepProfile({ onContinue, onProfile }) {
  const [mode, setMode] = useState(null);            // 'preset' | 'email'
  const [presetId, setPresetId] = useState(null);
  const [email, setEmail] = useState('');
  const [emailErr, setEmailErr] = useState('');
  const [domain, setDomain] = useState(null);
  const [tier, setTier] = useState(null);

  const preset = OFFICIAL_EXAMPLES.find(o => o.id === presetId);
  const profile = preset
    ? { name: preset.name, shortName: preset.name.split(',')[0], initials: acronym(preset.name), email: preset.email, cadre: preset.cadre, designation: preset.designation, organization: preset.organization, domain: preset.domain }
    : (mode === 'email' && email)
      ? { name: email.split('@')[0].replace(/[._-]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()), shortName: email.split('@')[0].split(/[._-]/)[0].replace(/\b\w/g, c => c.toUpperCase()), initials: email.split('@')[0].slice(0, 2).toUpperCase(), email, cadre: 'Official Officer', designation: 'Government Official', organization: 'Govt. of India', domain }
      : null;

  function acronym(name) {
    return name.replace(/^(Dr|Smt|Shri|Ms|Mr|Prof)\.?\s+/i, '').split(/[\s,]/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
  }

  const validateEmail = (v) => {
    const e = v.trim();
    if (!e) return 'Please enter your official work email address.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)) return 'That does not look like a valid email address.';
    if (!/@(mospi\.gov\.in|gov\.in|nic\.in|hpcl\.co\.in)$/i.test(e))
      return 'Only official government/PSU domains are accepted (e.g. @mospi.gov.in, @gov.in, @nic.in, @hpcl.co.in).';
    return '';
  };

  const emailValid = mode !== 'email' || !validateEmail(email);
  const canContinue = !!profile && !!domain && !!tier && emailValid;

  const selectPreset = (id) => { setMode('preset'); setPresetId(id); setEmail(''); setEmailErr(''); };

  const handleContinue = () => {
    if (!canContinue) return;
    if (profile) onProfile({ ...profile, domain: domain, tier: tier });
    onContinue(domain, tier);
  };

  return (
    <StepShell eyebrow="Step 1 of 5" title="Define Officer Profile" body="Identify your role and competency baseline. This calibrates the courses recommended and the assessment you take."
      nav={{
        back: null,
        next: { label: 'Continue', enabled: canContinue, onClick: handleContinue },
        hint: canContinue ? null : (profile ? (!domain ? 'Select your competency domain to continue.' : (!emailValid ? 'Enter a valid government/PSU email address.' : 'Select your experience tier to continue.')) : 'Select a profile or enter your official email to continue.')
      }}>
      <fieldset className="card mb-5">
        <legend className="font-bold text-[15px] mb-3" style={{ color: 'var(--ink)' }}>1 · Select Role</legend>
        <div className="grid sm:grid-cols-2 gap-3">
          {OFFICIAL_EXAMPLES.map(o => (
            <label key={o.id} className="opt">
              <input type="radio" name="role" value={o.id} checked={mode === 'preset' && presetId === o.id} onChange={() => selectPreset(o.id)} />
              <span className="min-w-0">
                <span className="block font-bold text-[14.5px]" style={{ color: 'var(--ink)' }}>{o.name}</span>
                <span className="block text-[13px] font-medium" style={{ color: 'var(--muted)' }}>{o.designation}</span>
                <span className="block text-[12.5px]" style={{ color: 'var(--faint)' }}>{o.cadre} · {o.organization.split('(')[0].trim()}</span>
              </span>
            </label>
          ))}
        </div>
        <div className="flex items-center gap-3 my-4" role="separator" aria-hidden="true">
          <span className="h-px flex-1" style={{ background: 'var(--line)' }}/><span className="text-[12.5px] font-semibold" style={{ color: 'var(--faint)' }}>OR</span><span className="h-px flex-1" style={{ background: 'var(--line)' }}/>
        </div>
        <div>
          <label htmlFor="official-email" className="block text-[13.5px] font-semibold mb-1.5" style={{ color: 'var(--body)' }}>
            Enter official email <span className="font-normal" style={{ color: 'var(--faint)' }}>(gov/PSU domains only)</span>
          </label>
          <input
            id="official-email" name="officialEmail" type="email" autoComplete="email"
            value={email} onChange={e => { setEmail(e.target.value); setEmailErr(''); if (mode !== 'email') { setMode('email'); setPresetId(null); } }}
            placeholder="e.g. officer@mospi.gov.in"
            aria-invalid={!!emailErr} aria-describedby={emailErr ? 'email-hint' : undefined}
            className="w-full rounded-lg border px-3.5 py-2.5 text-[15px] bg-white"
            style={{ borderColor: emailErr ? 'var(--err)' : 'var(--line-strong)' }}
          />
          {emailErr
            ? <p id="email-hint" className="mt-1.5 text-[13px] font-medium flex items-start gap-1.5" style={{ color: 'var(--err)' }} role="alert"><span aria-hidden="true">!</span>{emailErr}</p>
            : <p id="email-info" className="mt-1.5 text-[12.5px] opacity-60">Only official government / PSU email domains are accepted — validated live.</p>}
        </div>
      </fieldset>

      <fieldset className="card mb-5">
        <legend className="font-bold text-[15px] mb-3" style={{ color: 'var(--ink)' }}>2 · Select Competency Domain</legend>
        <div className="grid sm:grid-cols-2 gap-2.5">
          {DOMAIN_OPTIONS.map(d => (
            <label key={d.id} className="opt">
              <input type="radio" name="domain" value={d.id} checked={domain === d.id} onChange={() => setDomain(d.id)} />
              <span className="text-[14px] font-medium leading-snug" style={{ color: 'var(--body)' }}>{d.label}</span>
            </label>
          ))}
        </div>
      </fieldset>

      <fieldset className="card mb-5">
        <legend className="font-bold text-[15px] mb-3" style={{ color: 'var(--ink)' }}>3 · Experience Level</legend>
        <div className="grid sm:grid-cols-3 gap-2.5">
          {[
            { v: 'Easy', t: 'Foundations', d: 'Entry-level & Basics (6 Qs)' },
            { v: 'Medium', t: 'Operational', d: 'Field Procedures (6 Qs)' },
            { v: 'Hard', t: 'Advanced', d: 'Policy & Analysis (6 Qs)' }
          ].map(t => (
            <label key={t.v} className="opt">
              <input type="radio" name="tier" value={t.v} checked={tier === t.v} onChange={() => setTier(t.v)} />
              <span className="min-w-0">
                <span className="block font-bold text-[14px]" style={{ color: 'var(--ink)' }}>{t.t}</span>
                <span className="block text-[12.5px]" style={{ color: 'var(--faint)' }}>{t.d}</span>
              </span>
            </label>
          ))}
        </div>
      </fieldset>

      {profile && (
        <div className="card flex items-center gap-3 mt-5" style={{ borderColor: 'var(--primary-line)', background: 'var(--primary-soft)' }} role="status">
          <Icon.Shield s={20}/>
          <div className="min-w-0">
            <p className="font-bold text-[14px]" style={{ color: 'var(--primary-hover)' }}>Profile ready: {profile.name}</p>
            <p className="text-[13px]" style={{ color: 'var(--muted)' }}>{profile.cadre} · {profile.organization.split('(')[0].trim()}</p>
          </div>
        </div>
      )}
    </StepShell>
  );
}

/* =====================================================================
   STEP 2 — RECOMMENDED COURSES
   ===================================================================== */
function StepCourses({ domain, tier, enrolled, onToggleEnroll, onContinue, onBack }) {
  const [tab, setTab] = useState('Matched');
  const matched = DOMAIN_COURSE[domain] || [];
  const tabs = [
    { id: 'Matched', label: 'Recommended for you' },
    { id: 'Technical', label: 'Technical' },
    { id: 'Behavioural', label: 'Behavioural' },
    { id: 'Prescribed iGOT', label: 'Prescribed iGOT' }
  ];
  const shown = COURSES_CATALOG.filter(c => {
    if (tab === 'Matched') return matched.includes(c.id);
    return c.category === tab;
  });

  return (
    <StepShell eyebrow={`Step 2 of 5 · ${tier} tier`} title="Recommended Courses" body="Courses matched to your profile and competency gaps. Enrol in what you need, then proceed to the assessment."
      nav={{
        back: { label: 'Back', onClick: onBack },
        next: { label: 'Continue', enabled: true, onClick: onContinue },
        hint: 'Continue when ready. Enrolment is optional before assessment.'
      }}>
      <div className="flex flex-wrap gap-2 mb-5">
        {tabs.map(t => (
          <button key={t.id} type="button" aria-pressed={tab === t.id} onClick={() => setTab(t.id)}
            className="px-3.5 py-2 rounded-lg text-[13.5px] font-semibold border transition-colors"
            style={tab === t.id
              ? { background: 'var(--primary)', color: '#fff', borderColor: 'var(--primary)' }
              : { background: '#fff', color: 'var(--muted)', borderColor: 'var(--line-strong)' }}>
            {t.label}
          </button>
        ))}
      </div>

      {shown.length === 0 && (
        <div className="card text-[14px]" style={{ color: 'var(--muted)' }}>No courses in this category yet.</div>
      )}

      <ul className="space-y-3.5">
        {shown.map(c => {
          const isMatched = matched.includes(c.id);
          const isEnrolled = enrolled.includes(c.id);
          return (
            <li key={c.id} className="card" style={{ padding: '18px 20px' }}>
              <div className="flex items-start justify-between gap-3 flex-wrap">
                <div className="min-w-0">
                  <div className="flex items-center gap-2 flex-wrap mb-1">
                    <span className="text-[12.5px] font-bold px-2 py-0.5 rounded-md" style={{ background: 'var(--primary-soft)', color: 'var(--primary)' }}>{c.code}</span>
                    {isMatched && <span className="chip" style={{ background: 'var(--ok-soft)', color: 'var(--ok)' }}>{c.competencyCovered}</span>}
                    {isEnrolled && <span className="chip" style={{ background: 'var(--primary-soft)', color: 'var(--primary)' }}><Icon.Check s={12}/>Enrolled</span>}
                  </div>
                  <h2 className="font-bold text-[16px] leading-snug" style={{ color: 'var(--ink)' }}>{c.title}</h2>
                  <p className="text-[13.5px] mt-1" style={{ color: 'var(--muted)' }}>{c.description}</p>
                  <p className="text-[12.5px] font-medium mt-1.5" style={{ color: 'var(--faint)' }}>{c.provider}</p>
                </div>
              </div>
              <div className="flex items-center gap-2.5 flex-wrap mt-3 pt-3 border-t" style={{ borderColor: 'var(--line)' }}>
                <span className="text-[12.5px] font-semibold" style={{ color: 'var(--muted)' }}>{c.duration}</span>
                <span className="text-[12.5px] font-medium" style={{ color: 'var(--faint)' }}>·</span>
                <span className="text-[12.5px] font-semibold" style={{ color: 'var(--ok)' }}>{c.rating.toFixed(2)} ★</span>
                <span className="text-[12.5px] font-medium" style={{ color: 'var(--faint)' }}>·</span>
                <span className="text-[12.5px] font-medium" style={{ color: 'var(--faint)' }}>{c.enrolled}</span>
                <button type="button" onClick={() => onToggleEnroll(c.id)} className="btn ml-auto" style={isEnrolled
                  ? { background: 'var(--ok-soft)', color: 'var(--ok)', border: '1px solid var(--ok-line)', minHeight: 36, padding: '0 14px', fontSize: 13.5 }
                  : { background: 'var(--ink)', color: '#fff', minHeight: 36, padding: '0 14px', fontSize: 13.5 }}>
                  {isEnrolled ? <><Icon.Check s={12}/>Enrolled</> : 'Enrol in iGOT Module'}
                </button>
              </div>
            </li>
          );
        })}
      </ul>
    </StepShell>
  );
}

/* =====================================================================
   STEP 3 — SKILL ASSESSMENT (one question at a time)
   ===================================================================== */
function StepAssessment({ quiz, answers, setAnswer, submitted, onSubmit, onSubmitted, onBack }) {
  const [idx, setIdx] = useState(0);
  const q = quiz ? quiz[idx] : null;
  if (!quiz || !q) {
    return (
      <LoadingStep eyebrow="Step 3 of 5" title="Skill Assessment" body="Preparing your adaptive assessment…"
        message="Building your calibrated question set…" onBack={onBack} />
    );
  }
  const answered = Object.keys(answers).length;
  const allDone = answered === quiz.length;

  const pick = (optIdx) => {
    setAnswer(q.qid, optIdx);
    if (idx < quiz.length - 1) setTimeout(() => setIdx(idx + 1), 160);
  };

  if (submitted) {
    return (
      <StepShell eyebrow={`Step 3 of 5 · ${quiz.length} questions`} title="Assessment submitted" body="Your responses have been recorded. Proceed to view the gap analysis."
        nav={{
          back: null,
          next: { label: 'View Skill Gaps', enabled: true, onClick: onSubmitted },
          hint: 'Analysis is computed from your per-question accuracy.'
        }}>
        <div className="card text-center py-10" role="status">
          <div className="mx-auto flex items-center justify-center rounded-full mb-4" style={{ width: 56, height: 56, background: 'var(--ok-soft)', color: 'var(--ok)' }}>
            <Icon.Clipboard s={26}/>
          </div>
          <p className="font-extrabold text-[20px]" style={{ color: 'var(--ink)' }}>All {quiz.length} questions answered</p>
          <p className="text-[14px] mt-1 mb-6" style={{ color: 'var(--muted)' }}>Accuracy is being mapped to your competency domains.</p>
        </div>
      </StepShell>
    );
  }

  return (
    <StepShell eyebrow={`Step 3 of 5 · Question ${idx + 1} of ${quiz.length}`} title="Skill Assessment" body="Adaptive questions calibrated to your role and experience tier. Select an answer to advance automatically."
      nav={{
        back: { label: 'Back', onClick: onBack },
        next: { label: allDone ? 'Submit Assessment' : idx === quiz.length - 1 ? 'Next' : `Next · Question ${idx + 2}`, enabled: answers[q.qid] !== undefined && (idx < quiz.length - 1 || allDone), icon: !allDone,
                onClick: () => allDone ? onSubmit() : setIdx(Math.min(idx + 1, quiz.length - 1)) },
        hint: allDone ? 'Submit to compute your gap analysis.' : 'Answer to continue. You can revisit earlier questions.'
      }}>
      <div className="mb-5">
        <div className="flex items-center justify-between mb-1.5">
          <p className="text-[13px] font-semibold" style={{ color: 'var(--muted)' }}>{answered} of {quiz.length} answered</p>
          <p className="text-[13px] font-semibold" style={{ color: 'var(--primary)' }}>{Math.round(answered / quiz.length * 100)}%</p>
        </div>
        <div className="bar" role="progressbar" aria-valuemin="0" aria-valuemax={quiz.length} aria-valuenow={answered} aria-label="Assessment progress">
          <span style={{ width: `${answered / quiz.length * 100}%`, background: 'var(--primary)' }}/>
        </div>
      </div>

      <div className="card mb-5" key={q.id}>
        <div className="flex items-center gap-2 flex-wrap mb-2">
          <span className="chip" style={{ background: 'var(--primary-soft)', color: 'var(--primary)' }}>{q.topic}</span>
          <span className="chip" style={{ background: 'var(--bg)', color: 'var(--muted)', border: '1px solid var(--line)' }}>{q.competency}</span>
        </div>
        <h2 className="font-bold text-[17px] leading-snug mb-4" style={{ color: 'var(--ink)' }}>{q.question}</h2>
        <fieldset>
          <legend className="sr-only">Choose your answer</legend>
          <div className="space-y-2.5">
            {q.options.map((opt, oi) => (
              <label key={oi} className="opt">
                <input type="radio" name={`q-${q.qid}`} value={oi} checked={answers[q.qid] === oi} onChange={() => pick(oi)} />
                <span className="text-[14.5px] font-medium leading-snug" style={{ color: 'var(--body)' }}>{opt}</span>
              </label>
            ))}
          </div>
        </fieldset>
      </div>

      <div className="flex items-center justify-between">
        <button type="button" onClick={() => setIdx(Math.max(0, idx - 1))} disabled={idx === 0} className="btn btn-ghost" style={{ minHeight: 40, padding: '0 16px', fontSize: 14 }}>
          <Icon.Back s={14}/>Previous
        </button>
        <p className="text-[13px]" style={{ color: 'var(--faint)' }}>
          {quiz.map((qq, i) => (
            <button key={qq.id} type="button" onClick={() => setIdx(i)} className={"inline-block w-7 h-7 leading-6 text-center rounded-full text-[12.5px] font-bold mx-0.5 border " + (i === idx ? 'border-transparent' : '')}
              style={{
                background: answers[qq.qid] !== undefined ? 'var(--primary)' : '#fff',
                color: answers[qq.qid] !== undefined ? '#fff' : 'var(--faint)',
                border: i === idx && answers[qq.qid] === undefined ? '2px solid var(--primary)' : '1.5px solid var(--line-strong)',
                cursor: 'pointer'
              }}
              aria-label={`Go to question ${i + 1}${answers[qq.qid] !== undefined ? ' (answered)' : ''}`}
            >{i + 1}</button>
          ))}
        </p>
      </div>
    </StepShell>
  );
}

/* =====================================================================
   STEP 4 — DETECT SKILL GAPS
   ===================================================================== */
function StepGaps({ gaps, domainLabel, onContinue, onBack }) {
  if (!gaps || gaps.length === 0) {
    return (
      <LoadingStep eyebrow="Step 4 of 5" title="Detect Skill Gaps" body={`AI analysis of your ${domainLabel} assessment across all four official competency domains.`}
        message="Analysing your responses…" onBack={onBack} />
    );
  }

  return (
    <StepShell eyebrow="Step 4 of 5" title="Detect Skill Gaps" body={`AI analysis of your ${domainLabel} assessment across all four official competency domains.`}
      nav={{
        back: { label: 'Back', onClick: onBack },
        next: { label: 'View Performance Dashboard', enabled: true, onClick: onContinue },
        hint: 'Gap-to-mastery trackers update after each assessment.'
      }}>
      <ul className="space-y-3.5">
        {gaps.map(g => {
          const tone = STATUS_TONE[g.status];
          return (
            <li key={g.id} className="card">
              <div className="flex items-center justify-between gap-2 flex-wrap mb-2">
                <h2 className="font-bold text-[15px]" style={{ color: 'var(--ink)' }}>{g.name}</h2>
                <span className="chip" style={{ background: TONE_SOFT[tone], color: TONE_COLOR[tone] }}>{g.status}</span>
              </div>
              <div className="flex items-center justify-between text-[12.5px] font-semibold mb-1">
                <span style={{ color: 'var(--body)' }}>Current mastery · {g.scored}%</span>
                <span style={{ color: 'var(--faint)' }}>Target · {g.target}%</span>
              </div>
              <div className="bar">
                <span style={{ width: `${Math.min(100, g.scored)}%`, background: TONE_COLOR[tone] }}/>
              </div>
              <p className="text-[12.5px] mt-2 font-medium" style={{ color: 'var(--muted)' }}>
                {g.gap <= 0 ? 'At or above target — maintain through applied practice.'
                  : g.gap <= 15 ? `Gap of ${g.gap} pts to mastery. Enroll in recommended modules and re-assess.`
                  : g.gap <= 30 ? `Gap of ${g.gap} pts to mastery. Prioritise the recommended course path.`
                  : `Critical gap of ${g.gap} pts. Begin the recommended learning path immediately.`}
              </p>
            </li>
          );
        })}
      </ul>

      <div className="card mt-5" style={{ borderColor: 'var(--primary-line)', background: 'var(--primary-soft)' }}>
        <h2 className="font-bold text-[15px] mb-1.5 flex items-center gap-2" style={{ color: 'var(--ink)' }}><Icon.Target s={17}/>What this means</h2>
        <p className="text-[14px]" style={{ color: 'var(--muted)' }}>
          Your baseline is compared against the 85–90% mastery target used across the four official competency domains. Recommended courses in Step 2 and the dashboard in Step 5 are driven by these gaps.
        </p>
      </div>
    </StepShell>
  );
}

/* =====================================================================
   STEP 5 — PERFORMANCE DASHBOARD
   ===================================================================== */
function StepDashboard({ result, profile, domainLabel, onRestart }) {
  if (!result) {
    return (
      <LoadingStep eyebrow="Step 5 of 5 · Pratibha Darpan Report" title="Performance Dashboard" body="Preparing your consolidated report…"
        message="Computing your mastery report…" />
    );
  }
  const v = VERDICT.find(x => result.pct >= x.min);
  const tone = TONE_COLOR[v.tone];

  return (
    <StepShell eyebrow="Step 5 of 5 · Pratibha Darpan Report" title="Performance Dashboard" body={`Consolidated report for ${profile.name} — ${profile.cadre}, ${domainLabel} assessment.`}
      nav={{
        back: null,
        next: { label: 'Start New Assessment', enabled: true, onClick: onRestart, icon: false },
        hint: 'Results are stored for this profile only.'
      }}>
      <div className="grid sm:grid-cols-3 gap-3.5 mb-5">
        <div className="card text-center" role="group" aria-label="Overall score">
          <p className="text-[12.5px] font-bold uppercase tracking-wide mb-1" style={{ color: 'var(--faint)' }}>Overall Score</p>
          <p className="font-extrabold" style={{ color: 'var(--ink)', fontSize: 34, lineHeight: 1.1 }}>{result.pct}<span className="text-[18px]" style={{ color: 'var(--faint)' }}>%</span></p>
          <div className="bar mt-2"><span style={{ width: `${result.pct}%`, background: tone }}/></div>
        </div>
        <div className="card" role="group" aria-label="Readiness verdict">
          <p className="text-[12.5px] font-bold uppercase tracking-wide mb-1" style={{ color: 'var(--faint)' }}>Readiness Verdict</p>
          <p className="font-extrabold text-[20px] leading-snug" style={{ color: tone }}>{v.label}</p>
          <p className="text-[13px] mt-1" style={{ color: 'var(--muted)' }}>{result.correct} of {result.total} questions correct</p>
        </div>
        <div className="card" role="group" aria-label="Assessment details">
          <p className="text-[12.5px] font-bold uppercase tracking-wide mb-1" style={{ color: 'var(--faint)' }}>Assessment</p>
          <p className="text-[15px] font-bold" style={{ color: 'var(--ink)' }}>{result.domainLabel}</p>
          <p className="text-[13px]" style={{ color: 'var(--muted)' }}>{result.tier} tier · {profile.shortName}</p>
        </div>
      </div>

      <div className="grid md:grid-cols-2 gap-3.5 mb-5">
        <div className="card">
          <h2 className="font-bold text-[15px] mb-3" style={{ color: 'var(--ink)' }}>Top Strengths</h2>
          {result.strengths.length === 0 && <p className="text-[13.5px]" style={{ color: 'var(--muted)' }}>No strengths above 70% yet — recommended courses will build these.</p>}
          <ul className="space-y-2">
            {result.strengths.map(s => (
              <li key={s.qid} className="flex items-start gap-2.5 text-[13.5px]" style={{ color: 'var(--body)' }}>
                <span style={{ color: 'var(--ok)', marginTop: 1 }} aria-hidden="true"><Icon.Check s={14}/></span>
                <span><b>{s.topic}:</b> {s.competency}</span>
              </li>
            ))}
          </ul>
        </div>
        <div className="card">
          <h2 className="font-bold text-[15px] mb-3" style={{ color: 'var(--ink)' }}>Critical Skill Gaps</h2>
          {result.gapList.length === 0 && <p className="text-[13.5px]" style={{ color: 'var(--muted)' }}>No critical gaps detected.</p>}
          <ul className="space-y-2">
            {result.gapList.map(s => (
              <li key={s.qid} className="flex items-start gap-2.5 text-[13.5px]" style={{ color: 'var(--body)' }}>
                <span style={{ color: 'var(--err)', marginTop: 1 }} aria-hidden="true">✕</span>
                <span><b>{s.topic}:</b> {s.competency} — {s.suggestedCourse ? `recommended ${s.suggestedCourse}` : 'revisit core material'}</span>
              </li>
            ))}
          </ul>
        </div>
      </div>

      <div className="card mb-5">
        <h2 className="font-bold text-[15px] mb-4 flex items-center gap-2" style={{ color: 'var(--ink)' }}><Icon.Chart s={17}/>Gap-to-Mastery Progress Tracker</h2>
        <ul className="space-y-4">
          {result.tracker.map(g => (
            <li key={g.id}>
              <div className="flex items-center justify-between text-[13px] font-semibold mb-1">
                <span style={{ color: 'var(--body)' }}>{g.name}</span>
                <span style={{ color: 'var(--muted)' }}>{g.scored}% / {g.target}%</span>
              </div>
              <div className="bar"><span style={{ width: `${Math.min(100, g.scored)}%`, background: 'var(--primary)' }}/></div>
            </li>
          ))}
        </ul>
      </div>

      <div className="card" style={{ borderColor: 'var(--primary-line)', background: 'var(--primary-soft)' }}>
        <h2 className="font-bold text-[15px] mb-2 flex items-center gap-2" style={{ color: 'var(--ink)' }}><Icon.Shield s={17}/>AI Feedback</h2>
        <p className="text-[14.5px]" style={{ color: 'var(--body)' }}>
          {result.feedback}
        </p>
      </div>

      <details className="card mt-5">
        <summary className="font-bold text-[15px] cursor-pointer" style={{ color: 'var(--ink)' }}>Question-by-Question Audit ({result.total})</summary>
        <ul className="space-y-2.5 mt-4">
          {result.audit.map(a => (
            <li key={a.qid} className="pb-2.5 border-b last:border-0" style={{ borderColor: 'var(--line)' }}>
              <p className="text-[14px] font-semibold flex items-start gap-2" style={{ color: 'var(--ink)' }}>
                <span aria-hidden="true" style={{ color: a.correct ? 'var(--ok)' : 'var(--err)' }}>{a.correct ? '✓' : '✕'}</span>
                {a.question}
              </p>
              <p className="text-[13px] mt-1" style={{ color: a.correct ? 'var(--ok)' : 'var(--err)' }}>
                {a.correct ? 'Correct' : `Your answer: ${a.your}`}
                {!a.correct && <span className="text-[13px]" style={{ color: 'var(--muted)' }}> · Expected: {a.right}</span>}
              </p>
              <p className="text-[12.5px] mt-0.5 ph" style={{ color: 'var(--faint)' }}>{a.citation}</p>
            </li>
          ))}
        </ul>
      </details>
    </StepShell>
  );
}

/* =====================================================================
   APP — sequential state machine
   ===================================================================== */
function App() {
  const [saved] = useState(loadState);
  const [step, setStep] = useState(saved ? saved.step : 1);
  const [profile, setProfile] = useState(saved ? saved.profile : null);
  const [domain, setDomain] = useState(saved ? saved.domain : null);
  const [tier, setTier] = useState(saved ? saved.tier : null);
  const [enrolled, setEnrolled] = useState(saved ? saved.enrolled : []);
  const [answers, setAnswers] = useState(saved ? saved.answers : {});
  const [submitted, setSubmitted] = useState(saved ? saved.submitted : false);
  const [maxVisited, setMaxVisited] = useState(saved ? saved.maxVisited : 1);
  const [quiz, setQuiz] = useState(null);

  const persist = () => {
    const next = {
      step, profile, domain, tier, enrolled, answers, submitted, maxVisited
    };
    try { localStorage.setItem(LS_KEY, JSON.stringify(next)); } catch (e) {}
  };

  useEffect(() => {
    persist();
  });

  const domainLabel = domain ? (DOMAIN_OPTIONS.find(d => d.id === domain) || {}).label : '';

  /* build the calibrated 10-question set once (distinct questions per tier) */
  useEffect(() => {
    if (!domain || !tier || quiz) return;
    const bank = QUESTION_BANK[domain] || {};
    const mix = TIER_MIX[tier] || TIER_MIX.Medium;
    const taken = {};
    const chosen = mix.map((t, i) => {
      const arr = bank[t] || [];
      const k = taken[t] = taken[t] || 0;
      taken[t] += 1;
      const qq = arr[k % arr.length];
      if (!qq) return null;
      return { ...qq, qid: qq.id + '_' + k };
    });
    setQuiz(chosen.filter(Boolean));
  }, [domain, tier]);

  const handleSignOut = () => {
    setStep(1); setProfile(null); setDomain(null); setTier(null); setEnrolled([]);
    setAnswers({}); setSubmitted(false); setMaxVisited(1); setQuiz(null);
  };

  const go = (nextStep) => {
    setMaxVisited(m => Math.max(m, nextStep));
    setStep(nextStep);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const toggleEnroll = (id) => {
    const nextEnrolled = enrolled.includes(id) ? enrolled.filter(x => x !== id) : [...enrolled, id];
    setEnrolled(nextEnrolled);
  };

  const setAnswer = (qid, opt) => {
    const next = { ...answers, [qid]: opt };
    setAnswers(next);
  };

  /* ---------- result computation ---------- */
  const result = useMemo(() => {
    if (!quiz || !submitted) return null;
    const qs = quiz.map(qq => ({ ...qq, your: answers[qq.qid] }));
    const correct = qs.filter(qq => qq.your === qq.correct).length;
    const total = qs.length;
    const pct = Math.round(correct / total * 100);
    const correctQs = qs.filter(qq => qq.your === qq.correct);
    const wrongQs = qs.filter(qq => qq.your !== qq.correct);

    // gap computation: only the assessed domain has quiz evidence; untouched
    // domains keep their baseline (no fabricated signal for unmeasured areas)
    const gaps = INITIAL_COMPETENCIES.map(comp => {
      const isD = comp.id === domain;
      const acc = isD ? (correct / total) * 100 : 50;
      const delta = isD ? Math.round((acc - 50) / 100 * 44) : 0;
      const finalScored = Math.max(12, Math.min(99, comp.current + delta));
      const gap = comp.target - finalScored;
      const status = gap > 30 ? 'Critical Gap' : gap > 18 ? (isD ? 'Moderate Gap' : 'Priority Need') : 'On Track';
      return { ...comp, scored: finalScored, gap, status };
    });

    const courseFor = (id) => (DOMAIN_COURSE[id] || []).map(cid => COURSES_CATALOG.find(c => c.id === cid)).filter(Boolean);
    const byScored = [...gaps].sort((a, b) => a.scored - b.scored);
    const weakest = byScored[0];
    const recCourse = courseFor(weakest.id)[0];

    const feedback = correct === total
      ? `Outstanding result, ${profile.shortName}. Maintain mastery across ${weakest.name} and mentor colleagues on ${domainLabel}.`
      : `Focus on ${weakest.name} — ${100 - Math.round(weakest.scored)} pts from mastery. ${recCourse ? `Recommended: ${recCourse.title} (${recCourse.code}).` : 'Revisit core material and re-assess.'} Your strongest area remains ${byScored[byScored.length - 1].name}.`;

    return {
      pct, correct, total, domainLabel, tier,
      strengths: [...correctQs].sort((a, b) => a.topic.localeCompare(b.topic)).slice(0, 5).map(qq => ({ qid: qq.qid, topic: qq.topic, competency: qq.competency })),
      gapList: wrongQs.slice(0, 6).map(qq => ({
        qid: qq.qid, topic: qq.topic, competency: qq.competency,
        suggestedCourse: courseFor(domain).find(c => c && c.competencyCovered.toLowerCase().includes((qq.competency || '').toLowerCase().split(' ')[0]))?.code
      })),
      tracker: gaps,
      audit: qs.map(qq => ({ qid: qq.qid, question: qq.question, correct: qq.your === qq.correct, your: qq.options[qq.your], right: qq.options[qq.correct], citation: qq.citation })),
      feedback
    };
  }, [quiz, submitted, answers, domain, tier, domainLabel]);

  return (
    <div className="min-h-screen flex flex-col">
      <Header profile={profile} onSignOut={handleSignOut}/>
      <Stepper current={step} maxVisited={maxVisited} onJump={go}/>
      <main className="flex-1">
        {step === 1 && (
          <StepProfile
            onContinue={(d, t) => { setDomain(d); setTier(t); go(2); }}
            onProfile={setProfile}
          />
        )}
        {step === 2 && (
          <StepCourses domain={domain} tier={tier} enrolled={enrolled} onToggleEnroll={toggleEnroll}
            onContinue={() => go(3)} onBack={() => go(1)} />
        )}
        {step === 3 && (
          <StepAssessment quiz={quiz} answers={answers} setAnswer={setAnswer} submitted={submitted}
            onSubmit={() => setSubmitted(true)} onSubmitted={() => go(4)} onBack={() => go(2)} />
        )}
        {step === 4 && (
          <StepGaps gaps={result && result.tracker} domainLabel={domainLabel} onContinue={() => go(5)} onBack={() => go(3)} />
        )}
        {step === 5 && (
          <StepDashboard result={result} profile={profile} domainLabel={domainLabel}
            onRestart={() => { handleSignOut(); }} />
        )}
      </main>
      <footer className="border-t border-slate-200 bg-white py-4">
        <p className="text-center text-[12.5px] font-medium px-4" style={{ color: 'var(--faint)' }}>
          StatNexus: Karmayogi AI — MoSPI Data Informatics &amp; Innovation Division (DIID) · Problem Statement 26101 · Prototype for demonstration
        </p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
